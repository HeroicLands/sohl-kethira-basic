name: Version and Release

# Releasing is gated by the repository variable HL_RELEASE_ENABLED.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    release:
        uses: HeroicLands/.github/.gitea/workflows/release-foundry-package.yml@ab21b497b7907fc189365ab17bfc4425145cce58 # main
        with:
            package-kind: module
        secrets:
            RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
            GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
