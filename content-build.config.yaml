# This repository's build configuration, read by `@heroiclands/content-build`
# and — for the reserved `packageBuild:` section — `@heroiclands/package-build`.
#
# Every field, and which values are derived rather than authored, is documented
# in those packages' READMEs. Comments here are limited to what they cannot
# tell you: the things about *this* module that would otherwise read as
# accidents.

contentPackage: kethira
packageKind: modules

stats:
    systemId: sohl
    lastModifiedBy: kethirabuild0000

# ⚠️ The **Foundry** range, moved verbatim out of the retired hand-authored
# `module.json`. Correcting it is #16's job.
compatibility:
    minimum: "14"
    verified: "14"

# The **system** range — a different subject wearing the same key.
#
# `minimum` is `0.8.0` because that is where the Item model these documents are
# shaped for begins: 0.8.0 removed the `lineage`, `trait` and `combattechnique`
# types and gave `mystery` the `subType` field every mystery note here carries,
# which 0.7.0's model does not define. Established by comparing each compiled
# document's `system` keys against the schema of each tagged release — the
# `skill` pack (66 items) is clean from 0.8.0 on. (0.7.0 is the first Foundry-14
# release, so anything earlier is not merely stale but unloadable: sohl
# 0.4.0–0.5.6 declare Foundry `minimum: "12"` while this module requires 14.)
#
# **`verified` must track the released `sohl` version.** It is what every
# compiled document is stamped with as `_stats.systemVersion`, so a stale value
# makes each shipped entry claim to have been built against a system that has
# not existed for four minors. Nothing bumps it automatically — raising it is a
# release-time step (#16).
relationships:
    systems:
        - id: sohl
          type: system
          manifest: https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT/releases/latest/download/system.json
          compatibility:
              minimum: "0.8.0"
              verified: "0.8.2"

itemBuilders: sohl

# **Two packs share the `Item` type, and neither is `default: true`.** That is
# deliberate: with several packs of a type and no default, a note declaring no
# `pack:` routes nowhere and **fails the build, naming the note**. A default
# would silently absorb a typo'd or forgotten declaration into the wrong
# compendium.
#
# The two pack names are load-bearing and cannot be merged: a compendium UUID
# carries its pack name
# (`Compendium.sohl-kethira-basic.characteristics.Item.<id>`), so collapsing
# them breaks every existing world. Folders are per-pack because the two sets
# are disjoint.
#
# **`characters` (Actor) is deliberately absent**, and omitting it here now
# withdraws the compendium *declaration* as well as the compile — this list is
# also the manifest's `packs` array. A Kethira being's embedded items are
# addressed by shortcode (`attribute:str`, `skill:init`) and almost all belong
# to the **`sohl` package**, which this repository does not hold; an unresolved
# embedded item is a hard error, and configuring the pass fails all 1,057 of
# them, taking the two working Item packs down with it. `actor-folders.yaml`
# and the 28 `being` notes stay complete against the day that catalog is
# available at build time. Tracked in #28.
packs:
    - {
          name: characteristics,
          label: Characteristics,
          type: Item,
          folders: item-folders.yaml,
      }
    - {
          name: mysteries,
          label: Mysteries,
          type: Item,
          folders: mystery-folders.yaml,
      }

# This module publishes **no link manifest**, and that is a licensing decision
# rather than a consequence of having no site: emitting `kethira.json` would be
# the dependency edge that stops the module being withdrawable (#1385/#1446,
# and this repository's CLAUDE.md). It still consumes the manifests of packages
# its notes cite, vendored in `assets/manifests/`.
publish:
    site: false
    manifests: { publish: false, consume: true }

packageBuild:
    assets:
        - { from: assets/artwork, to: assets/artwork }
        - { from: assets/images, to: assets/images }
        - { from: assets/simple-calendar, to: assets/simple-calendar }
        - { from: lang, to: lang }
        - { from: LICENSE, to: LICENSE }
        - { from: README.md, to: README.md }

    lang:
        sources: lang/*.json
        help: >-
            A dotted-prefix collision makes foundry.utils.expandObject throw, and
            Foundry then drops the whole translation file. Make each key a leaf
            OR a branch, never both.

    manifest:
        title: HarnMaster Kethira Basic Items
        description: Basic items needed for playing Song of Heroic Lands in the world of Kethira
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE
        readme: README.md
        languages:
            - lang: en
              name: English
              path: lang/en.json
        packFolders:
            - name: HarnMaster Kethira Basic
              sorting: m
              color: "#008000"
              # `characters` is absent here too: a pack folder naming a
              # compendium that is no longer declared is a dangling reference.
              packs:
                  - characteristics
                  - mysteries
        flags:
            allowBugReporter: true
