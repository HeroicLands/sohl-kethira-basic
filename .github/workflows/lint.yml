# Run the checks on the pull request that broke them, not on the release
# afterwards (#44).
#
# Until this landed, the only check a pull request here got was **No AI
# attribution**. `npm run lint` and the build did run, but only inside
# `build:noci` in `release.yml` — and only on the push to `main` that actually
# cuts a release. So every gate this repository had fired after the merge that
# broke it, and reported as a failed release rather than a failed pull request.
#
# ## What runs, and what does not
#
# This runs **five of the six checks `npm run lint` chains**, as named steps so a
# failure says which one. The omission is measured, not incidental. On the commit
# that added this file:
#
# | check               | state on `main`                          |
# | ------------------- | ---------------------------------------- |
# | `lint:format`       | clean — 405 files                        |
# | `lint:markdown`     | clean                                    |
# | `lint:lang`         | clean — 1 localization file              |
# | `lint:content-links`| clean — 364 notes, every anchor lands    |
# | `lint:labels`       | clean — registry and §3 agree, 11 labels |
# | `lint:addresses`    | clean — 371 addresses (#41 closed)       |
#
# `lint:addresses` was once left out, because a gate that cannot go green is
# worse than no gate: it trains people to merge past a red check, and then the
# red check stops meaning anything. Its backlog was #41, which is now closed —
# the findings were the content-format conversion meeting a package-build pin
# that predated the format, and taking 11.0.0 cleared all 342 with no note
# edited. So the chain runs whole, as this file said it should when that day
# came.
#
# ## The build, and why it is a second job
#
# `build` runs `npm run build:db`, so a note that lints clean but fails to
# *compile* is caught on the pull request rather than on the release after it
# (#63). It waited on #56/#61, which fixed the pack order `main` did not compile
# cold with; that has merged.
#
# It is a separate job rather than a sixth step for two reasons. It is the only
# check here that reaches the network — `build:deps` downloads the pinned `sohl`
# release the actors pass resolves a being's embedded items against — so it has a
# failure surface none of the lint steps have, and mixing the two would make a
# third party's outage read as a content failure. And a compile failure and a
# lint failure are both worth seeing in one run, rather than whichever comes
# first hiding the other.
#
# **Every run here is cold**, which is the case that matters. `build/` is
# gitignored and holds the dependency catalogue too (`build/cache/foreign`), so a
# runner starts with nothing; #56 was green on every local tree that had built
# once and red only on a fresh checkout. On the commit that added this job a cold
# `npm run build:db` exits 0, compiling 66 items, 269 items and 28 actors.
#
# `build:module` — the manifest pass, and the rest of what `build:noci` runs — is
# deliberately not here. It writes the manifest from configuration and the staged
# tree, so it answers for an edit to `package-build.config.yaml` rather than for
# anything a content note can do, and that is what this gate is for.
# `@heroiclands/package-build` 6.0.0 moves a real check into it (`packFolders`,
# package-build#81); adopting that version is the point to reconsider.
name: Lint

on:
    pull_request:
        types: [opened, reopened, synchronize]
    # Post-merge signal too: `release.yml` runs the lint chain only on a push
    # that actually releases, so `main` otherwise goes unchecked between
    # releases.
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint:
        name: Content, prose, and registry checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            # Every check below reads the tracked tree and needs only the
            # toolchain: nothing here fetches a dependency catalogue, compiles a
            # pack, or reaches the network.
            - name: Install dependencies
              run: npm ci

            # The whole chain: formatting, markdown, localization, content
            # links, the label registry, and addresses. `lint:addresses` was
            # left out while #41 stood, on the reasoning that a gate which
            # cannot go green is worse than no gate. #41 is closed and the
            # check is clean, so the chain runs whole again — which is what
            # this file said to do when that day came.
            - name: Lint
              run: npm run lint

    build:
        name: Content pack compile
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # `build:deps` fetches the pinned `sohl` release, `build:assets`
            # stages the static tree, and `build:compiledb` compiles all three
            # packs — resolving every being's embedded items — to LevelDB.
            # Nothing is cached into `build/`, so this is the cold compile a tree
            # that has already built once cannot perform on itself.
            - name: Compile the content packs
              run: npm run build:db
