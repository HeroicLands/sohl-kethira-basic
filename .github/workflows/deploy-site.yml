# Build and deploy /kethira — the authored homepage plus every page the
# content tree compiles to (`publish.site: content` in
# `package-build.config.yaml`).
#
# The runner, the completeness guard, the hosting project, the custom domain and
# the upload are identical for every package that publishes a subtree of
# www.heroiclands.org, so they live once in `HeroicLands/.github` and this file
# calls them (HeroicLands/.github#5). What stays here is the trigger and the two
# facts only this repository knows: which Pages project hosts it, and which
# credentials to hand over.
#
# The build itself is also this repository's — the shared workflow runs
# `npm run build:site` and knows nothing about what that script does. It only
# requires the tree land under `build/site/kethira/`, which is what the
# generated `build/hugo/hugo.toml`'s `publishDir` arranges (`content-build
# site` writes it from package.json and package-build.config.yaml on every
# run; this repository carries no Hugo configuration of its own).
#
# `min-pages` / `max-pages` are REQUIRED in `content` mode — the shared
# workflow reads `publish.site` from the same config the build reads, and
# fails the run rather than deploy an ungoverned page count. `min-pages` is a
# floor set below a complete build's page count, not an assertion about
# today's count: it catches a collapsed build (a taxonomy that stopped
# rendering, a content tree the build stopped walking), not a change in how
# many notes this package carries. `max-pages` is a ceiling with the same
# margin the other way, catching a build that runs away rather than asserting
# an upper bound on authored content. Both are measured against
# `build/site/kethira`'s `index.html` count, less the one Hugo's own site root
# contributes once the landing has an address of its own — see the shared
# workflow's own comments for that arithmetic.
#
# `_headers` AND `_redirects` ARE THIS REPOSITORY'S, as of #83 — written into
# the deployment root by `utils/build-site-root.mjs`, which `npm run build:site`
# runs last. Pages reads both files only at that root, never inside the package
# prefix.
#
# The workflow writes a default `_headers` — the *.pages.dev and
# kethira.pkg.heroiclands.org noindex rules, identical for every package
# (HeroicLands/.github#7) — but ONLY when a build produces no `_headers` at all;
# it never merges into one. Since package-build 15 published the landing at
# `/kethira/homepage-root/`, `/kethira/` has to redirect there with a pinned
# `Cache-Control`, and a header has nowhere to live but `_headers`. So this
# build now writes that file, the default no longer fires, and the noindex rules
# are carried in the script alongside the cache rules. Read its comments before
# changing either half.
name: Deploy the Kethira site to Cloudflare Pages

on:
    # Every push to `main` republishes the page. No path filter: a rebuild is
    # cheap next to how quietly a hand-maintained path list goes stale, and a
    # push that changes nothing the site serves merely republishes the same
    # bytes.
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy:
        uses: HeroicLands/.github/.github/workflows/deploy-package-site.yml@main
        with:
            # Not derived from the package name: renaming a live Pages project
            # to fit a convention would break its deployment history.
            project: sohl-kethira-basic
            # Measured: a complete build carries 398 pages (399 `index.html`
            # files under `build/site/kethira`, less Hugo's own site root).
            # Set with headroom on both sides of that figure — a floor and a
            # ceiling that catch a collapsed or runaway build, not a
            # description of today's count.
            min-pages: 350
            max-pages: 500
        # By name, never `secrets: inherit` — inheriting would hand a workflow in
        # another repository every secret this one holds for a job that needs two.
        secrets:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
