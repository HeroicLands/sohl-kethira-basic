contentPackage: kethira
packageKind: modules

authors:
    - name: Tom Rodriguez
      email: toasty@heroiclands.org
      discord: toasty#8538

stats:
    lastModifiedBy: kethirabuild0000

compatibility:
    minimum: "14.359"
    verified: "14.359"
relationships:
    systems:
        - id: sohl
          type: system
          manifest: https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT/releases/download/v0.8.8/system.json
          compatibility:
              minimum: "0.8.8"
              verified: "0.8.8"
          # The `characters` pass resolves a being's embedded items — `attribute:str`,
          # `skill:init` and similar — against this system's Item packs, fetched by
          # `npm run build:deps`; a cold cache fails naming that command rather than
          # reaching the network. Pinned to `verified` above, not `latest`.
          itemCatalog: true

itemBuilders: sohl

# Neither Item pack is `default: true`, deliberately: with several packs of a
# type and no default, a note declaring no `pack:` routes nowhere and fails the
# build naming the note, rather than being silently absorbed into the wrong
# compendium.
#
# This list orders for a reader, not for the compiler — the build derives
# compile order from what each pass reads. It currently yields
# `characteristics, mysteries, journals, characters`, the sequence Foundry
# lists the compendiums in: the two reference packs, then the journal entries
# a being's prose compiles into, then the actors that carry them.
packs:
    - { name: characteristics, label: Characteristics, type: Item }
    - { name: mysteries, label: Mysteries, type: Item }
    - { name: journals, label: Journals, type: JournalEntry }
    - { name: characters, label: Characters, type: Actor }

# The content tree published as a book, built by `package-build release` and
# attached to the Release. The selection and its order live in `book.yaml`, and
# `front` carries the title page, which reproduces Keléstia's trademark notice
# because the Fan Material Guidelines require it wherever this material is
# published.
pdf:
    books:
        - id: core
          title: HârnMaster Kethira Basic
          subtitle: A Song of Heroic Lands Module
          document: book.yaml
          front:
              - book-front.md
          out: kethira
    # The notice the Fan Material Guidelines require, printed at the foot of
    # the title page.
    license: |
        This is unofficial Hârn fan material. Hârn®, HârnWorld®, and HârnMaster® are registered trademarks of Arien Crossby, licensed by Keléstia Productions Ltd (https://www.kelestia.com/). All related concepts and material are the property of Arien Crossby and Keléstia Productions Ltd (https://www.kelestia.com/). Used with permission.

        For details, see the Kelestia.com Fanon Guidelines (https://www.kelestia.com/faq#n86).
    # All three faces are named, because an unnamed one is not a default but a
    # fallback: `sans` resolves to `serif` when it is absent, so the headings
    # the renderer sets in the sans slot come out in the body face.
    fonts:
        serif: Libertinus Serif
        sans: Libertinus Sans
        mono: Libertinus Mono

# This package's content is its site: with no `publish.address` prefix, a
# page publishes at /kethira/<type>-<shortcode>/.
site:
    assets: https://cdn.heroiclands.org
    description: A Song of Heroic Lands module carrying the basic mechanical pieces for play in the world of Kethira.
    # Cloudflare Pages serves this as a real 404 for any unmatched path;
    # without it, an unmatched path falls back to the site root — a soft 404
    # that reads as success to a link checker. The first link returns to this
    # module's own landing; the rest route to sibling sites, since no section
    # here fits every missed path.
    notfound:
        tagline: This module has no page at
        sitenoun: module
        links:
            - title: HârnMaster Kethira Basic
              url: /
              text: What this module carries, and how to install it.
            - title: Song of Heroic Lands
              url: https://www.heroiclands.org/sohl/
              text: The Foundry VTT system this module is content for.
            - title: Keléstia Productions
              url: https://www.kelestia.com/harnmaster
              text: Where HârnMaster Kethira itself is bought.

packageBuild:
    shippingLicenses:
        - Harn Fanon

    assets:
        - { from: assets/artwork, to: assets/artwork }
        - { from: assets/simple-calendar, to: assets/simple-calendar }
        - { from: lang, to: lang }
        - { from: LICENSE, to: LICENSE }
        - { from: README.md, to: README.md }

    lang:
        sources: lang/*.json
        help: >-
            A dotted-prefix collision makes foundry.utils.expandObject throw, and
            Foundry then drops the whole translation file. Make each key a leaf
            OR a branch, never both.

    manifest:
        title: HarnMaster Kethira Basic Items
        descriptionHtml: Basic items needed for playing Song of Heroic Lands in the world of Kethira
        license: LICENSE
        readme: README.md
        languages:
            - lang: en
              name: English
              path: lang/en.json
        packFolders:
            - name: HarnMaster Kethira Basic
              sorting: m
              color: "#008000"
              packs:
                  - characters
                  - journals
                  - characteristics
                  - mysteries
        flags:
            allowBugReporter: true
